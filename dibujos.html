<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dibujos de Ana Catarina von Papen.">
  <title>Dibujos — Ana Catarina von Papen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=66">
<style>

/* Each work occupies its own full-width section within the portfolio's palette. */
.drawings-page .art-index{display:flex;flex-wrap:wrap;gap:26px;margin-top:24px;font:800 1rem 'Barlow Condensed',sans-serif;text-transform:uppercase}
.drawings-page .art-index a{border-bottom:1px solid currentColor;padding-bottom:4px}
.drawings-page .drawings-section-heading{padding-bottom:clamp(35px,5vw,65px)}
.drawings-page .drawings-gallery,.drawings-page .drawings-section-digital .drawings-gallery{display:block;padding:0;background:transparent}
.drawings-page .drawing,.drawings-page .drawing:nth-child(n),.drawings-page .drawing-feature+.drawing,.drawings-page .drawing-wide+.drawing{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(28px,6vw,100px);margin:0;padding:clamp(45px,7vw,100px) clamp(22px,7vw,120px);background:var(--work-bg,var(--cream));color:var(--work-ink,var(--red));min-width:0}
.drawings-page .drawing-open,.drawings-page .drawing-feature .drawing-open,.drawings-page .drawing-dark .drawing-open,.drawings-page .drawing-blue .drawing-open,.drawings-page .drawing-wide .drawing-open{grid-column:1;grid-row:1;background:transparent;padding:0;border:0;border-radius:0;box-shadow:none;overflow:visible;transform:none;transition:opacity .2s}
.drawings-page .drawing-open:hover{opacity:.9;transform:none;box-shadow:none}
.drawings-page .drawing-open:focus-visible{outline:2px solid currentColor;outline-offset:8px;transform:none;box-shadow:none}
.drawings-page .drawing-open img,.drawings-page .drawing-feature .drawing-open img{display:block;width:100%;height:auto;max-height:82vh;max-height:82svh;object-fit:contain;margin:auto;border-radius:0}
.drawings-page .drawing figcaption{grid-column:2;grid-row:1;display:block;border:0;margin:0;padding:0;color:inherit}
.drawings-page .drawing figcaption span{display:block;font:800 1.15rem 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;margin-bottom:20px}
.drawings-page .drawing figcaption strong{display:block;font:900 clamp(2.5rem,5vw,5.4rem)/1.03 Fraunces,Georgia,serif;letter-spacing:-.055em;text-align:left;overflow-wrap:anywhere}
.drawings-page .drawing:nth-child(even){grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.drawings-page .drawing:nth-child(even) .drawing-open{grid-column:2}
.drawings-page .drawing:nth-child(even) figcaption{grid-column:1}
.drawings-page .drawing:has(img[src$="portrait-01.jpeg"]){--work-bg:#382326;--work-ink:#f4bdad}
.drawings-page .drawing:has(img[src$="cat.jpeg"]){--work-bg:#2d2235;--work-ink:#e5bedc}
.drawings-page .drawing:has(img[src$="architecture-01.jpeg"]){--work-bg:#192e32;--work-ink:#c5ddd3}
.drawings-page .drawing:has(img[src$="birds.jpeg"]){--work-bg:#391f30;--work-ink:#f2bdd3}
.drawings-page .drawing:has(img[src$="portrait-03.jpeg"]){--work-bg:#352627;--work-ink:#ecc5ac}



.drawings-page .drawing:has(img[src$="vitiligo.jpeg"]){--work-bg:#3b2036;--work-ink:#ffc6dd}
.drawings-page .drawing:has(img[src$="noise.jpeg"]){--work-bg:#231624;--work-ink:#ffb6c6}
.drawings-page .drawing:has(img[src$="final-mouse.jpeg"]){--work-bg:#302236;--work-ink:#edbdd9}

.drawings-page .drawing:has(img[src$="roar.jpeg"]){--work-bg:#261c40;--work-ink:#f1d588}
@media(max-width:700px){
.drawings-page .drawing,.drawings-page .drawing:nth-child(n){display:flex;flex-direction:column;align-items:stretch;gap:28px;padding:42px 24px 52px;margin:0}
.drawings-page .drawing figcaption{order:-1}
.drawings-page .drawing figcaption span{font-size:1rem;margin-bottom:10px}
.drawings-page .drawing figcaption strong{font-size:clamp(2.3rem,9vw,4rem)}
.drawings-page .drawing-open img,.drawings-page .drawing-feature .drawing-open img{width:100%;height:auto;max-height:75vh;max-height:75svh}
.drawings-page .drawings-section-heading{padding-bottom:35px}
}
@media(prefers-reduced-motion:reduce){.drawings-page .drawing-open{transition:none}}

</style>
</head>
<body class="portfolio-subpage drawings-page" data-accent="pink">
  <header class="site-header" id="inicio"><a class="wordmark" href="index.html" aria-label="Volver al portfolio de Ana Catarina von Papen">Ana Catarina<br><span>von</span> <span>Papen</span></a><nav aria-label="Navegación de Dibujos"><a href="index.html#trabajo"><span class="illustrated-arrow arrow-left" aria-hidden="true"></span> Portfolio</a><a href="index.html#contacto">Contacto</a></nav></header>
  <main>
    <section class="drawings-intro" aria-labelledby="page-title"><p class="eyebrow">Portfolio / 02 · Selección de obras</p><h1 id="page-title">Dibujos e<br>ilustración<span class="illustrated-spark" aria-hidden="true"></span></h1><div class="drawings-intro-bottom"><p>Entre el papel y la pantalla.</p><span>9 obras</span></div><nav class="art-index" aria-label="Galerías"><a href="#sobre-papel">01 / Sobre papel</a><a href="#ilustraciones">02 / En pantalla</a></nav></section>
    <section class="drawings-section" id="sobre-papel" aria-labelledby="drawings-title"><div class="drawings-section-heading"><p class="eyebrow">01 / Sobre papel</p><h2 id="drawings-title">Dibujos</h2></div><div class="drawings-gallery">
      <figure class="drawing drawing-paper"><button type="button" class="drawing-open" aria-label="Ampliar retrato en sanguina"><img src="assets/drawings/portrait-01.jpeg" alt="Retrato a lápiz rojo de un hombre sobre papel crema" width="1956" height="2739" loading="lazy"></button><figcaption><span>Dibujo</span><strong>Retrato en sanguina</strong></figcaption></figure>
      <figure class="drawing"><button type="button" class="drawing-open" aria-label="Ampliar Gato esfinge"><img src="assets/drawings/cat.jpeg" alt="Dibujo de un gato esfinge en lápiz rosa dentro de un cuaderno" width="1152" height="1536" loading="lazy"></button><figcaption><span>Dibujo</span><strong>Gato esfinge</strong></figcaption></figure>
      <figure class="drawing drawing-wide"><button type="button" class="drawing-open" aria-label="Ampliar arquitectura en tinta"><img src="assets/drawings/architecture-01.jpeg" alt="Dibujo a tinta azul de un edificio de varios pisos frente a las montañas" width="1152" height="1536" loading="lazy"></button><figcaption><span>Dibujo</span><strong>Arquitectura en tinta</strong></figcaption></figure>
      <figure class="drawing"><button type="button" class="drawing-open" aria-label="Ampliar Estudio de aves"><img src="assets/drawings/birds.jpeg" alt="Estudios de aves en lápiz rosa sobre papel" width="1152" height="1536" loading="lazy"></button><figcaption><span>Dibujo</span><strong>Estudio de aves</strong></figcaption></figure>
      <figure class="drawing drawing-paper"><button type="button" class="drawing-open" aria-label="Ampliar retrato de perfil"><img src="assets/drawings/portrait-03.jpeg" alt="Retrato de perfil a lápiz rojo en un cuaderno abierto" width="1152" height="1536" loading="lazy"></button><figcaption><span>Dibujo</span><strong>Retrato de perfil</strong></figcaption></figure>
    </div></section>
    <section class="drawings-section drawings-section-digital" id="ilustraciones" aria-labelledby="digital-title"><div class="drawings-section-heading"><p class="eyebrow">02 / En pantalla</p><h2 id="digital-title">Ilustración digital</h2></div><div class="drawings-gallery">
      <figure class="drawing drawing-feature"><button type="button" class="drawing-open" aria-label="Ampliar Vitíligo"><img src="assets/drawings/vitiligo.jpeg" alt="Ilustración digital rosa de una chica rodeada de ojos y formas orgánicas" width="864" height="1536"></button><figcaption><span>Ilustración digital</span><strong>Vitíligo</strong></figcaption></figure>
      <figure class="drawing drawing-dark"><button type="button" class="drawing-open" aria-label="Ampliar Noise"><img src="assets/drawings/noise.jpeg" alt="Ilustración digital roja de una mujer sobre un fondo oscuro con formas luminosas" width="1080" height="1350" loading="lazy"></button><figcaption><span>Ilustración digital</span><strong>Noise</strong></figcaption></figure>
      <figure class="drawing"><button type="button" class="drawing-open" aria-label="Ampliar Final Mouse"><img src="assets/drawings/final-mouse.jpeg" alt="Ilustración digital de una mujer ante un cielo rosado con destellos dorados" width="1080" height="1350" loading="lazy"></button><figcaption><span>Ilustración digital</span><strong>Final Mouse</strong></figcaption></figure>
      <figure class="drawing"><button type="button" class="drawing-open" aria-label="Ampliar Roar"><img src="assets/drawings/roar.jpeg" alt="Ilustración gráfica de un tigre violeta y amarillo con boca abierta" width="1132" height="1536" loading="lazy"></button><figcaption><span>Ilustración digital</span><strong>Roar</strong></figcaption></figure>
    </div></section>
  </main>
  <dialog class="drawing-lightbox" aria-label="Obra ampliada"><button type="button" class="drawing-close" aria-label="Cerrar imagen">Cerrar ×</button><img alt=""><p></p></dialog>
  <footer><a href="index.html#trabajo"><span class="illustrated-arrow arrow-left" aria-hidden="true"></span> Volver al portfolio</a><a href="#inicio">Volver arriba <span class="illustrated-arrow arrow-up" aria-hidden="true"></span></a></footer>
  <script>
    const lightbox = document.querySelector('.drawing-lightbox');
    const expanded = lightbox.querySelector('img');
    document.querySelectorAll('.drawing-open').forEach(button => button.addEventListener('click', () => {
      const image = button.querySelector('img');
      expanded.src = image.src;
      expanded.alt = image.alt;
      lightbox.querySelector('p').textContent = button.closest('figure').querySelector('strong').textContent;
      lightbox.showModal();
    }));
    lightbox.querySelector('.drawing-close').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', event => { if (event.target === lightbox) lightbox.close(); });
  </script>
</body>
</html>
